name: CI

on:
  push:
    branches: ['main', 'feature/*']
    # Sin esto, un push del tag de versión que crea release-please (evento
    # de tag, no de rama) nunca dispara este workflow: el push a `main` que
    # lo acompaña sólo produce la imagen "main"/<sha corto> (ver
    # version.mjs, camino refType==="branch"), nunca la versionada
    # (0.1.0/0.1/latest), que sale únicamente del camino refType==="tag".
    tags: ['v*']
  pull_request:

jobs:
  ci:
    uses: zaphold2k/ci-workflows/.github/workflows/ci.yml@v2
    permissions:
      contents: write
      packages: write
      pull-requests: write
      actions: read
    with:
      ci_workflows_ref: v2
      language: node
      branch_model: simple
      main_branch: main
      work_branch_pattern: 'feature/*'
      image_name: ghcr.io/zaphold2k/duplexalmar
      test_command: npm test -- --coverage --reporter=junit --outputFile=.ci/junit.xml
      e2e_command: npx playwright install --with-deps chromium && npm run test:e2e:docker && npm run test:e2e-api:docker
      smoke_test_endpoint: http://localhost:4321/
      smoke_test_port: '4321'
      smoke_test_env: |
        {
          "ADMIN_USERNAME": "smoke",
          "ADMIN_PASSWORD_HASH": "scrypt$32768$8$1$c2FsdA$aGFzaA",
          "SESSION_SECRET": "smoke-test-session-secret-32-characters",
          "WHATSAPP_NUMBER": "5492235293371",
          "DATA_DIR": "/data",
          "MAX_UPLOAD_FILE_SIZE_MB": "15",
          "MAX_UPLOAD_BATCH_SIZE": "20"
        }
      readme_path: README.md
      agent_docs: CLAUDE.md

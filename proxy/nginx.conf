# Reverse proxy mínimo (ver design.md, decisión 11): sirve /images/
# directamente desde el volumen, sin pasar por Node, y reenvía el resto a la
# app. La elección definitiva de proxy y la emisión de certificados TLS se
# resuelven en el change de despliegue; esto sólo cubre lo que ese diseño
# exige de esta pieza.

server {
    listen 80;

    # Igual que src/server/images/serve-file.ts: caché pública inmutable de
    # un año, porque el nombre de archivo lleva un id que nunca cambia de
    # contenido.
    location /images/ {
        alias /data/images/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://app:4321;
        # $http_host (no $host): tiene que llegar con el puerto incluido tal
        # cual lo mandó el cliente, porque Astro compara el Origin de cada
        # POST contra este Host para su protección CSRF (security.checkOrigin).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cubre el peor caso de MAX_UPLOAD_FILE_SIZE_MB × MAX_UPLOAD_BATCH_SIZE
    # con margen; si esos límites cambian en .env, actualizar acá también.
    client_max_body_size 350m;
}
